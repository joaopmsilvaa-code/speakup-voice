<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F8FC">
  <title>SpeakUp · Restaurante em Nova York</title>
  <meta name="description" content="Aula de inglês por voz do SpeakUp com o tutor Alex.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>
        </span>
        <span class="brand-name">SpeakUp</span>
      </div>
      <span class="chip">Lição 3 · 8 min</span>
    </header>

    <section class="lesson">
      <h1>Restaurante em Nova York</h1>
      <div class="tutor">
        <span class="avatar" aria-hidden="true">A</span>
        <div class="tutor-text">
          <strong>Alex</strong>
          <span><i class="dot" aria-hidden="true"></i>Tutor virtual · Online</span>
        </div>
        <span class="chip chip-soft">Nível B1</span>
      </div>
    </section>

    <section class="chat-card" aria-label="Conversa por voz com o Alex">
      <div id="voiceflow-chat-frame"></div>
      <p class="fallback" id="vf-fallback" hidden>Não foi possível carregar a aula agora. Verifique sua conexão e recarregue a página.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
